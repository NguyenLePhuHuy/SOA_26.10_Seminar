global:
  resolve_timeout: 2m

route:
  group_by: ['alertname', 'service']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 10m
  receiver: 'webhook-notifications'
  routes:
    - receiver: 'webhook-notifications'
      continue: true
    - receiver: 'telegram-notifications'

receivers:
  - name: 'webhook-notifications'
    webhook_configs:
      - url: 'http://webhook-receiver:5001/webhook'
        send_resolved: true
        max_alerts: 10

  - name: 'telegram-notifications'
    telegram_configs:
      - bot_token_file: '/tmp/alertmanager/bot_token'
        chat_id: __TELEGRAM_CHAT_ID__
        send_resolved: true
        parse_mode: 'HTML'
        message: |
          {{ if eq .Status "firing" }}🚨 <b>[ALARM FIRING] {{ .CommonLabels.alertname }}</b>{{ else }}✅ <b>[RESOLVED] {{ .CommonLabels.alertname }}</b>{{ end }}
          <b>Trang thai:</b> <code>{{ .Status | toUpper }}</code>
          <b>Muc do:</b> <code>{{ .CommonLabels.severity }}</code>
          <b>Dich vu:</b> <code>{{ .CommonLabels.service }}</code>
          {{ if .CommonAnnotations.summary }}<b>Tom tat:</b> {{ .CommonAnnotations.summary }}{{ end }}
          {{ if .CommonAnnotations.description }}<b>Mo ta:</b> {{ .CommonAnnotations.description }}{{ end }}
          {{ if .CommonAnnotations.action }}<b>Khac phuc:</b> <i>{{ .CommonAnnotations.action }}</i>{{ end }}
          <b>Thoi gian:</b> {{ (index .Alerts 0).StartsAt.Format "15:04:05 02/01/2006" }}
